name: build-windows-installer
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}
      - name: Install deps
        run: npm install
      - name: Build frontend (dist-web)
        run: npm run web
      - name: Generate icons
        run: npx tauri icon src/app-icon.png
      - name: Tauri build (NSIS + MSI)
        shell: pwsh
        run: |
          npx tauri build *>&1 | Tee-Object -FilePath ../tauri-build.log
          exit $LASTEXITCODE
      - name: Surface real errors into Annotations on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path ../tauri-build.log) {
            Select-String -Path ../tauri-build.log -Pattern '^error|error\[E|-->|cannot find|not found|failed' | Select-Object -First 14 | ForEach-Object { "::error::$($_.Line.Trim())" }
            Get-Content ../tauri-build.log -Tail 12 | ForEach-Object { "::error::TAIL: $($_.Trim())" }
          } else {
            "::error::tauri-build.log missing"
          }
      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stickyboard-windows
          path: src-tauri/target/release/bundle
