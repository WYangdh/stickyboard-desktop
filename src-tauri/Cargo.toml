cargo-features = []

[package]
name = "stickyboard"
version = "16.3.1"
description = "便签台 StickyBoard — 钉在 Windows 桌面上的便签"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
